version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Vite 8 requires Node 20.19+ or 22.12+; pinned explicitly since the
        # build image's default Node version isn't guaranteed to satisfy that.
        - nvm install 22
        - nvm use 22
        - npm ci
    build:
      commands:
        - npm run lint
        - npm run test
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'Content-Security-Policy'
        value: "frame-ancestors 'none'"
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
  - pattern: 'index.html'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache'
  - pattern: 'sw.js'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache'
  - pattern: '/assets/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
